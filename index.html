<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notulen Rapat</title>
<style>
  :root{
    --paper:#F7F6F2;
    --panel:#FFFFFF;
    --ink:#1E2733;
    --ink-soft:#5A6472;
    --line:#DDD9CF;
    --accent:#2C4A6E;
    --accent-soft:#E7ECF2;
    --ok:#3F7D5C;
    --ok-soft:#E4F0EA;
    --warn:#B8863B;
    --warn-soft:#F6EEE0;
    --bad:#A23B3B;
    --bad-soft:#F4E5E3;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
  }
  .app{
    display:grid;
    grid-template-columns: 340px 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){
    .app{grid-template-columns: 1fr;}
    .sidebar{border-right:none; border-bottom:1px solid var(--line);}
  }

  /* Sidebar */
  .sidebar{
    border-right:1px solid var(--line);
    padding:22px 18px;
    background:var(--panel);
  }
  .brand{
    font-family:var(--serif);
    font-size:22px;
    letter-spacing:0.2px;
    margin:0 0 2px 0;
  }
  .brand-sub{
    color:var(--ink-soft);
    font-size:12.5px;
    margin:0 0 18px 0;
  }
  .mode-row{
    display:flex;
    gap:6px;
    background:var(--accent-soft);
    padding:4px;
    border-radius:8px;
    margin-bottom:16px;
  }
  .mode-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:7px 0;
    font-size:13px;
    font-weight:600;
    color:var(--accent);
    border-radius:6px;
    cursor:pointer;
  }
  .mode-btn.active{
    background:var(--accent);
    color:#fff;
  }
  .new-btn{
    width:100%;
    padding:10px 12px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:16px;
  }
  .new-btn:hover{background:#233a58;}
  .filter-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .chip{
    border:1px solid var(--line);
    background:transparent;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .chip.active{
    border-color:var(--accent);
    color:var(--accent);
    background:var(--accent-soft);
    font-weight:600;
  }
  .list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height: calc(100vh - 240px);
    overflow-y:auto;
  }
  .item{
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    cursor:pointer;
    background:var(--panel);
  }
  .item:hover{border-color:var(--accent);}
  .item.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .item-title{
    font-weight:600;
    font-size:14px;
    margin-bottom:3px;
  }
  .item-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--ink-soft);
  }
  .status-tag{
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:20px;
  }
  .status-selesai{background:var(--ok-soft); color:var(--ok);}
  .status-berjalan{background:var(--warn-soft); color:var(--warn);}
  .status-batal{background:var(--bad-soft); color:var(--bad);}
  .empty-list{
    color:var(--ink-soft);
    font-size:13px;
    padding:20px 4px;
  }

  /* Main */
  .main{
    padding:32px 40px;
    max-width:760px;
  }
  .main-empty{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    min-height:60vh;
    color:var(--ink-soft);
  }
  .main-empty h2{
    font-family:var(--serif);
    color:var(--ink);
    font-weight:normal;
  }
  .doc-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
    margin-bottom:22px;
  }
  .doc-title{
    font-family:var(--serif);
    font-size:28px;
    margin:0 0 8px 0;
    line-height:1.25;
  }
  .doc-date{
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .field-group{margin-bottom:20px;}
  .field-label{
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:6px;
  }
  .field-view{
    white-space:pre-wrap;
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
  }
  .field-view.placeholder{
    color:var(--ink-soft);
    font-style:italic;
  }
  input[type=text], input[type=date], textarea, select{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 11px;
    font-family:var(--sans);
    font-size:14.5px;
    color:var(--ink);
    background:#fff;
  }
  textarea{resize:vertical; min-height:80px;}
  input:focus, textarea:focus, select:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .status-select{
    display:inline-block;
    width:auto;
    min-width:150px;
    font-weight:600;
    cursor:pointer;
  }
  .row-actions{
    display:flex;
    gap:10px;
    margin-top:26px;
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  .btn{
    padding:9px 16px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{background:#233a58;}
  .btn-danger{
    color:var(--bad);
    border-color:var(--bad);
    background:#fff;
  }
  .btn-danger:hover{background:var(--bad-soft);}
  .save-toast{
    position:fixed;
    bottom:22px;
    right:22px;
    background:var(--ink);
    color:#fff;
    padding:10px 16px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .25s, transform .25s;
    pointer-events:none;
  }
  .save-toast.show{opacity:1; transform:translateY(0);}
  .status-pill-inline{
    font-size:11.5px;
    font-weight:700;
    padding:3px 10px;
    border-radius:20px;
    display:inline-block;
  }
  .viewer-note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .riwayat-block{
    margin-top:28px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  .riwayat-title{
    font-family:var(--serif);
    font-size:16px;
    margin:0 0 12px 0;
  }
  .riwayat-item{
    display:flex;
    gap:12px;
    padding:9px 0;
    border-bottom:1px dashed var(--line);
    font-size:13px;
  }
  .riwayat-item:last-child{border-bottom:none;}
  .riwayat-time{
    color:var(--ink-soft);
    min-width:150px;
    flex-shrink:0;
  }
  .riwayat-body b{font-weight:700;}
  .riwayat-empty{
    color:var(--ink-soft);
    font-size:13px;
    font-style:italic;
  }
  .sync-error{color:var(--bad);}

  /* Dashboard (tampilan staf) */
  .main.main-wide{max-width:1180px;}
  .dash-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .dash-title{
    font-family:var(--serif);
    font-size:28px;
    margin:0 0 6px 0;
  }
  .dash-sub{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:0;
  }
  .dash-updated{
    font-size:12px;
    color:var(--ink-soft);
  }
  .dash-stats{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    margin-bottom:26px;
  }
  @media (max-width:700px){ .dash-stats{grid-template-columns:repeat(2,1fr);} }
  .stat-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    background:var(--panel);
  }
  .stat-num{
    font-family:var(--serif);
    font-size:26px;
    line-height:1.1;
  }
  .stat-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .stat-card.st-berjalan .stat-num{color:var(--warn);}
  .stat-card.st-selesai .stat-num{color:var(--ok);}
  .stat-card.st-batal .stat-num{color:var(--bad);}
  .dash-grid{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .dash-card{
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    background:var(--panel);
  }
  .dash-card-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    margin-bottom:14px;
  }
  .dash-card-title{
    font-family:var(--serif);
    font-size:19px;
    margin:0 0 4px 0;
  }
  .dash-card-date{
    color:var(--ink-soft);
    font-size:13px;
  }
  .dash-fields{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:16px;
    margin-bottom:8px;
  }
  @media (max-width:820px){ .dash-fields{grid-template-columns:1fr;} }
  .dash-field-label{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .dash-field-value{
    font-size:13.5px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .dash-field-value.placeholder{
    color:var(--ink-soft);
    font-style:italic;
  }
  .riwayat-toggle{
    background:none;
    border:none;
    color:var(--accent);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    padding:0;
    margin-top:6px;
  }
  .riwayat-toggle:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <p class="brand">Notulen Rapat</p>
    <p class="brand-sub" id="syncLabel">Memuat data&hellip;</p>

    <div class="mode-row">
      <button class="mode-btn active" id="btnStaf" onclick="setMode('staf')">Dashboard</button>
      <button class="mode-btn" id="btnAdmin" onclick="setMode('admin')">Admin</button>
    </div>

    <button class="new-btn" id="btnNew" style="display:none" onclick="newRapat()">+ Rapat Baru</button>

    <div class="filter-row">
      <button class="chip active" data-status="semua" onclick="setFilter('semua')">Semua</button>
      <button class="chip" data-status="berjalan" onclick="setFilter('berjalan')">Berjalan</button>
      <button class="chip" data-status="selesai" onclick="setFilter('selesai')">Selesai</button>
      <button class="chip" data-status="batal" onclick="setFilter('batal')">Batal</button>
    </div>

    <div class="list" id="list"></div>
  </div>

  <div class="main" id="main">
    <div class="main-empty">
      <h2>Memuat dashboard&hellip;</h2>
    </div>
  </div>
</div>

<div class="save-toast" id="toast">Tersimpan</div>

<script>
// URL Web App Google Apps Script (backend Google Sheets + riwayat)
const API_URL = 'https://script.google.com/macros/s/AKfycbzQNWXvqPJZRm2TDMlaBf6QJXCOMMA8eujG1tFZHjsUsEIRo8btSFc_yWYCLlN7ynTo3Q/exec';

let mode = 'staf'; // 'staf' = Dashboard, 'admin' = Admin
let filterStatus = 'semua';
let rapatData = {}; // id -> object
let riwayatCache = {}; // id -> array riwayat
let expandedRiwayat = {}; // id -> true/false (khusus dashboard)
let selectedId = null;
let isEditingNew = false;
let pollTimer = null;

const STATUS_LABEL = { berjalan: 'Berjalan', selesai: 'Selesai', batal: 'Batal' };

function uid(){
  return 'r' + Date.now() + Math.random().toString(16).slice(2,8);
}

function toDateInputValue(v){
  if(!v) return '';
  const s = String(v);
  return s.includes('T') ? s.slice(0,10) : s;
}

function fmtDate(iso){
  const s = toDateInputValue(iso);
  if(!s) return '(tanggal belum diisi)';
  const d = new Date(s + 'T00:00:00');
  if(isNaN(d)) return s;
  return d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
}

function fmtDateTime(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d)) return String(v);
  return d.toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

// Ubah objek dari Sheet (ID, Tanggal, Judul, ...) jadi objek internal (id, tanggal, judul, ...)
function sheetToItem(o){
  return {
    id: o.ID,
    tanggal: toDateInputValue(o.Tanggal),
    judul: o.Judul || '',
    pembahasan: o.Pembahasan || '',
    tindakLanjut: o.RencanaTindakLanjut || '',
    hasilTindakLanjut: o.HasilTindakLanjut || '',
    status: o.Status || 'berjalan',
    createdAt: o.DibuatPada,
    updatedAt: o.DiubahPada
  };
}

async function loadAll(){
  try{
    const res = await fetch(API_URL + '?action=list');
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Gagal memuat');
    const newData = {};
    (json.data || []).forEach(o => { const item = sheetToItem(o); newData[item.id] = item; });
    rapatData = newData;
    renderList();
    if(selectedId && rapatData[selectedId] && !isEditingNew){
      renderMain();
    }
    document.getElementById('syncLabel').textContent = 'Tersinkron ke Google Sheets \u2022 terlihat semua staf';
    document.getElementById('syncLabel').classList.remove('sync-error');
  }catch(e){
    document.getElementById('syncLabel').textContent = 'Gagal terhubung ke Google Sheets';
    document.getElementById('syncLabel').classList.add('sync-error');
    console.error(e);
  }
}

async function loadRiwayat(id){
  try{
    const res = await fetch(API_URL + '?action=history&id=' + encodeURIComponent(id));
    const json = await res.json();
    riwayatCache[id] = json.ok ? (json.data || []) : [];
  }catch(e){
    riwayatCache[id] = [];
    console.error(e);
  }
}

async function saveRapat(item){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'save', item })
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Gagal menyimpan');
  showToast('Tersimpan ke Google Sheets');
  await loadAll();
}

async function deleteRapat(id){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'delete', id })
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Gagal menghapus');
  delete rapatData[id];
  selectedId = null;
  renderList();
  renderMain();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function setMode(m){
  mode = m;
  document.getElementById('btnStaf').classList.toggle('active', m==='staf');
  document.getElementById('btnAdmin').classList.toggle('active', m==='admin');
  document.getElementById('btnNew').style.display = (m==='admin') ? 'block' : 'none';
  isEditingNew = false;
  renderList();
  renderMain();
}

function setFilter(s){
  filterStatus = s;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.status === s));
  renderList();
}

function setFilter(s){
  filterStatus = s;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.status === s));
  renderList();
  renderMain();
}

function renderList(){
  const list = document.getElementById('list');
  if(mode === 'staf'){
    list.innerHTML = '<div class="empty-list">Rekap lengkap seluruh rapat ditampilkan di panel dashboard \u2192</div>';
    return;
  }
  let items = Object.values(rapatData);
  if(filterStatus !== 'semua'){
    items = items.filter(r => r.status === filterStatus);
  }
  items.sort((a,b) => (b.tanggal || '').localeCompare(a.tanggal || '') || (b.createdAt||0) - (a.createdAt||0));

  if(items.length === 0){
    list.innerHTML = '<div class="empty-list">Tidak ada rapat pada kategori ini.</div>';
    return;
  }

  list.innerHTML = '';
  items.forEach(r => {
    const div = document.createElement('div');
    div.className = 'item' + (r.id === selectedId ? ' selected' : '');
    div.onclick = () => {
      isEditingNew = false;
      selectedId = r.id;
      renderList();
      renderMain();
      loadRiwayat(r.id).then(() => { if(selectedId === r.id) renderMain(); });
    };
    div.innerHTML = `
      <div class="item-title">${escapeHtml(r.judul || '(tanpa judul)')}</div>
      <div class="item-meta">
        <span>${fmtDate(r.tanggal)}</span>
        <span class="status-tag status-${r.status}">${STATUS_LABEL[r.status] || r.status}</span>
      </div>
    `;
    list.appendChild(div);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function newRapat(){
  selectedId = null;
  isEditingNew = true;
  renderMain();
}

function renderMain(){
  const main = document.getElementById('main');

  if(mode === 'staf'){
    main.classList.add('main-wide');
    renderDashboard(main);
    return;
  }
  main.classList.remove('main-wide');

  if(isEditingNew){
    renderForm(main, {
      id: uid(), tanggal:'', judul:'', pembahasan:'', tindakLanjut:'', hasilTindakLanjut:'', status:'berjalan', createdAt: Date.now()
    }, true);
    return;
  }

  const r = selectedId ? rapatData[selectedId] : null;
  if(!r){
    main.innerHTML = `
      <div class="main-empty">
        <h2>Belum ada rapat dipilih</h2>
        <p>Pilih rapat dari daftar di sebelah kiri, atau klik "+ Rapat Baru".</p>
      </div>`;
    return;
  }

  renderForm(main, r, false);
}

function renderDashboard(main){
  const all = Object.values(rapatData);
  const total = all.length;
  const cBerjalan = all.filter(r => r.status === 'berjalan').length;
  const cSelesai = all.filter(r => r.status === 'selesai').length;
  const cBatal = all.filter(r => r.status === 'batal').length;

  let items = all;
  if(filterStatus !== 'semua'){
    items = items.filter(r => r.status === filterStatus);
  }
  items.sort((a,b) => (b.tanggal || '').localeCompare(a.tanggal || ''));

  const cardsHtml = items.length === 0
    ? '<div class="empty-list">Belum ada rapat pada kategori ini.</div>'
    : items.map(r => {
        const expanded = !!expandedRiwayat[r.id];
        return `
        <div class="dash-card">
          <div class="dash-card-head">
            <div>
              <h3 class="dash-card-title">${escapeHtml(r.judul || '(tanpa judul)')}</h3>
              <div class="dash-card-date">${fmtDate(r.tanggal)}</div>
            </div>
            <span class="status-pill-inline status-${r.status}">${STATUS_LABEL[r.status] || r.status}</span>
          </div>
          <div class="dash-fields">
            <div>
              <div class="dash-field-label">HASIL PEMBAHASAN</div>
              <div class="dash-field-value ${r.pembahasan ? '' : 'placeholder'}">${escapeHtml(r.pembahasan || 'Belum diisi.')}</div>
            </div>
            <div>
              <div class="dash-field-label">RENCANA TINDAK LANJUT</div>
              <div class="dash-field-value ${r.tindakLanjut ? '' : 'placeholder'}">${escapeHtml(r.tindakLanjut || 'Belum diisi.')}</div>
            </div>
            <div>
              <div class="dash-field-label">HASIL TINDAK LANJUT</div>
              <div class="dash-field-value ${r.hasilTindakLanjut ? '' : 'placeholder'}">${escapeHtml(r.hasilTindakLanjut || 'Belum diisi.')}</div>
            </div>
          </div>
          <button class="riwayat-toggle" onclick="toggleRiwayat('${r.id}')">${expanded ? 'Sembunyikan riwayat' : 'Lihat riwayat perubahan'}</button>
          ${expanded ? renderRiwayatHtml(r.id) : ''}
        </div>`;
      }).join('');

  main.innerHTML = `
    <div class="dash-header">
      <div>
        <h1 class="dash-title">Dashboard Notulen Rapat</h1>
        <p class="dash-sub">Rekap seluruh rapat yang diinput Admin, diperbarui otomatis secara realtime.</p>
      </div>
      <span class="dash-updated">Diperbarui ${new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</span>
    </div>

    <div class="dash-stats">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total Rapat</div></div>
      <div class="stat-card st-berjalan"><div class="stat-num">${cBerjalan}</div><div class="stat-label">Berjalan</div></div>
      <div class="stat-card st-selesai"><div class="stat-num">${cSelesai}</div><div class="stat-label">Selesai</div></div>
      <div class="stat-card st-batal"><div class="stat-num">${cBatal}</div><div class="stat-label">Batal</div></div>
    </div>

    <div class="dash-grid">${cardsHtml}</div>
  `;
}

function toggleRiwayat(id){
  const willExpand = !expandedRiwayat[id];
  expandedRiwayat[id] = willExpand;
  if(willExpand && riwayatCache[id] === undefined){
    renderMain();
    loadRiwayat(id).then(renderMain);
  } else {
    renderMain();
  }
}

function renderForm(main, r, isNew){
  main.innerHTML = `
    <div class="field-group">
      <div class="field-label">Tanggal Rapat</div>
      <input type="date" id="f_tanggal" value="${r.tanggal || ''}">
    </div>

    <div class="field-group">
      <div class="field-label">Judul Rapat</div>
      <input type="text" id="f_judul" placeholder="Contoh: Rapat Koordinasi Bulanan" value="${escapeHtml(r.judul || '')}">
    </div>

    <div class="field-group">
      <div class="field-label">Hasil Pembahasan Rapat</div>
      <textarea id="f_pembahasan" placeholder="Ringkasan poin-poin yang dibahas...">${escapeHtml(r.pembahasan || '')}</textarea>
    </div>

    <div class="field-group">
      <div class="field-label">Rencana Tindak Lanjut</div>
      <textarea id="f_tindak" placeholder="Apa yang akan dilakukan selanjutnya...">${escapeHtml(r.tindakLanjut || '')}</textarea>
    </div>

    <div class="field-group">
      <div class="field-label">Hasil Tindak Lanjut</div>
      <textarea id="f_hasil" placeholder="Hasil setelah tindak lanjut dijalankan...">${escapeHtml(r.hasilTindakLanjut || '')}</textarea>
    </div>

    <div class="field-group">
      <div class="field-label">Status</div>
      <select id="f_status" class="status-select">
        <option value="berjalan" ${r.status==='berjalan'?'selected':''}>Berjalan</option>
        <option value="selesai" ${r.status==='selesai'?'selected':''}>Selesai</option>
        <option value="batal" ${r.status==='batal'?'selected':''}>Batal</option>
      </select>
    </div>

    <div class="row-actions">
      <button class="btn btn-primary" onclick="handleSave('${r.id}', ${isNew}, event)">Simpan</button>
      ${isNew ? '<button class="btn" onclick="cancelNew()">Batal</button>' : '<button class="btn btn-danger" onclick="handleDelete(\''+r.id+'\')">Hapus Rapat</button>'}
    </div>

    ${isNew ? '' : renderRiwayatHtml(r.id)}
  `;
}

async function handleSave(id, isNew, evt){
  const item = {
    id: id,
    tanggal: document.getElementById('f_tanggal').value,
    judul: document.getElementById('f_judul').value.trim(),
    pembahasan: document.getElementById('f_pembahasan').value,
    tindakLanjut: document.getElementById('f_tindak').value,
    hasilTindakLanjut: document.getElementById('f_hasil').value,
    status: document.getElementById('f_status').value
  };
  if(!item.judul){
    showToast('Judul rapat wajib diisi');
    return;
  }
  const btn = evt.target;
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';
  try{
    await saveRapat(item);
    isEditingNew = false;
    selectedId = id;
    await loadRiwayat(id);
    renderMain();
  }catch(e){
    showToast('Gagal menyimpan, coba lagi');
    console.error(e);
    btn.disabled = false;
    btn.textContent = 'Simpan';
  }
}

function cancelNew(){
  isEditingNew = false;
  renderMain();
}

async function handleDelete(id){
  if(!confirm('Hapus rapat ini? Tindakan tidak dapat dibatalkan, tapi jejaknya tetap tersimpan di Riwayat.')) return;
  try{
    await deleteRapat(id);
    showToast('Rapat dihapus');
  }catch(e){
    showToast('Gagal menghapus, coba lagi');
    console.error(e);
  }
}

function renderRiwayatHtml(id){
  const items = riwayatCache[id];
  if(items === undefined){
    return '<div class="riwayat-block"><h3 class="riwayat-title">Riwayat Perubahan</h3><div class="riwayat-empty">Memuat riwayat...</div></div>';
  }
  if(items.length === 0){
    return '<div class="riwayat-block"><h3 class="riwayat-title">Riwayat Perubahan</h3><div class="riwayat-empty">Belum ada riwayat.</div></div>';
  }
  const rows = items.map(r => {
    let ket = `<b>${escapeHtml(r.Aksi)}</b>`;
    if(r.Aksi === 'Diubah' && r.StatusSebelum !== r.StatusSesudah){
      ket += ` \u2014 status ${escapeHtml(STATUS_LABEL[r.StatusSebelum]||r.StatusSebelum)} \u2192 ${escapeHtml(STATUS_LABEL[r.StatusSesudah]||r.StatusSesudah)}`;
    }
    if(r.Perubahan){
      ket += `<br><span style="color:var(--ink-soft)">${escapeHtml(r.Perubahan)}</span>`;
    }
    return `<div class="riwayat-item"><div class="riwayat-time">${escapeHtml(fmtDateTime(r.Waktu))}</div><div class="riwayat-body">${ket}</div></div>`;
  }).join('');
  return `<div class="riwayat-block"><h3 class="riwayat-title">Riwayat Perubahan</h3>${rows}</div>`;
}

async function init(){
  await loadAll();
  renderList();
  renderMain();
  pollTimer = setInterval(loadAll, 4000);
}

init();
</script>
</body>
</html>
